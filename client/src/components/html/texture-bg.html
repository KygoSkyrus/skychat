<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Orbitron:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        body {
            box-sizing: border-box;
            padding: 6px;
            margin: 0;
            /* background: #000; */
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* z-index: 1; */
        }

        .name section {
            font-size: 120px;
            font-family: "Jersey 25", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: violet;
            text-shadow: 1px 2px 19px #ee82eead;
            background-image: url('./texture.png');
            background: red;
            background-repeat: repeat;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* GLITCH EFFECT */
        .glitch {
            font-size: 5rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                0.025em 0.04em 0 #fffc00;
        }

        .glitch span {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div class="name">
        <section class="glitch">
            CYBERPUNK
        </section>
    </div>


</body>

</html>
